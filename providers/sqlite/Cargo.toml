[package]
name = "violet-provider-sqlite"
description = "SQLite provider for Violet, as a WebAssembly component"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

# Built on its own for `wasm32-wasip2`, not as part of the app's workspace.
# SQLite is C: building it takes the WASI SDK's clang (see
# .cargo/config.toml and scripts/package-providers.sh):
#   WASI_SDK_PATH=/opt/wasi-sdk cargo build --release --target wasm32-wasip2 \
#       --manifest-path providers/sqlite/Cargo.toml
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
violet-sdk = { path = "../../crates/violet-sdk" }
# SQLite's own sources, built without an OS layer (SQLITE_OS_OTHER, set in
# .cargo/config.toml): the provider brings its own (src/vfs.rs).
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
log = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
