[package]
name = "violet-provider-mysql"
description = "MySQL and MariaDB provider for Violet, as a WebAssembly component"
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

# Built on its own for `wasm32-wasip2`, not as part of the app's workspace:
#   cargo build --release --target wasm32-wasip2 \
#       --manifest-path providers/mysql/Cargo.toml
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
violet-sdk = { path = "../../crates/violet-sdk" }
log = "0.4"
sha1 = "0.10"
sha2 = "0.10"
# caching_sha2_password and sha256_password send the password encrypted
# with the server's RSA key when the connection is not TLS.
rsa = { version = "0.9", default-features = false, features = ["std", "pem"] }
rand_core = { version = "0.6", default-features = false }
getrandom = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
