[workspace]
resolver = "3"
members = [".", "crates/*"]
# Providers build on their own, for wasm32-wasip2.
exclude = ["providers"]

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
violet-core = { path = "crates/violet-core" }
violet-app = { path = "crates/violet-app" }
violet-providers = { path = "crates/violet-providers" }
violet-sdk = { path = "crates/violet-sdk" }
violet-storage = { path = "crates/violet-storage" }
violet-wasm = { path = "crates/violet-wasm" }

async-trait = "0.1"
directories = "6"
# Profiling (hotpath.rs). Without the `hotpath` feature its macros expand
# to the code they wrap: nothing is measured and nothing is linked.
hotpath = { version = "0.28.6", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"

[package]
name = "violet"
description = "A modern, multi-database client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
violet-core.workspace = true
violet-app.workspace = true
violet-providers.workspace = true
violet-wasm.workspace = true
violet-storage.workspace = true
hotpath.workspace = true
log.workspace = true
serde.workspace = true
zeroize.workspace = true
# Local times in the query history. Already in the tree via fastframe-log.
jiff = "0.2"
rfd = "0.17"
# Debug-only screenshots (src/ui/devtools.rs). Already in the tree via arboard.
image = { version = "0.25", default-features = false, features = ["png"] }

eframe = "0.36.1"
egui = "0.36.1"
egui_extras = { version = "0.36.1", features = ["svg"] }

fastframe-text = { git = "https://github.com/crmne/fastframe", tag = "v0.2.3" }
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.2.3" }
fastframe-icons = { git = "https://github.com/crmne/fastframe", tag = "v0.2.3" }
fastframe-log = { git = "https://github.com/crmne/fastframe", tag = "v0.2.3" }
fastframe-macos = { git = "https://github.com/crmne/fastframe", tag = "v0.2.3" }
# Self-update from the GitHub releases (src/update.rs).
fastframe-update = { git = "https://github.com/crmne/fastframe", tag = "v0.6.0" }
anyhow = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
serde_json.workspace = true

[build-dependencies]
# The Windows executable's icon (build.rs).
winresource = "0.1"

[features]
# `cargo run --features hotpath`: times the hot paths (frames, queries,
# provider calls, downloads) and prints a report on exit; meanwhile the
# `hotpath` TUI shows it live. `hotpath-alloc` adds allocations.
hotpath = ["hotpath/hotpath", "hotpath/threads"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]

[lints]
workspace = true

[profile.release]
# Whole-program LTO lets LLVM inline across crates (egui, wasmtime,
# the domain crates); one codegen unit gives it the whole picture.
lto = "fat"
codegen-units = 1
strip = true
# `panic = "abort"` is left out on purpose: database work runs on tokio
# worker threads, and unwinding keeps a panicking driver task from taking
# the window (and unsaved SQL) down with it.

# Dependencies are built optimised even in debug, so the UI stays smooth
# while iterating; Violet's own crates keep fast incremental builds.
[profile.dev.package."*"]
opt-level = 2

# fastframe builds against forks of egui and winit with fixes not yet
# released upstream. Patches only apply at the root, so they live here.
[patch.crates-io]
ecolor = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
eframe = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui-wgpu = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui-winit = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui_extras = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
egui_glow = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
emath = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
epaint = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
epaint_default_fonts = { git = "https://github.com/crmne/egui", rev = "ba6790fe7cf46e58e8d27ce1524cbfdee745e938" }
winit = { git = "https://github.com/crmne/winit", rev = "ed7caa9023f10b397f5b6ec8284a840cbd8a6f65" }
