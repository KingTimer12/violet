# Builds Violet for Windows, macOS and Linux, and the database providers
# (WebAssembly components), and publishes them.
#
# - Push a tag `v*` (git tag v0.1.0 && git push origin v0.1.0): everything
#   is built and attached to a GitHub release of that tag. The providers'
#   files sit at the release's top level, where Violet looks for them:
#   releases/latest/download/providers.json.
# - Run it by hand (Actions > Release > Run workflow): everything is built
#   and kept as workflow artifacts only, nothing is published.
#
# The packages are built by scripts/package-*.sh, which run the same way
# on a developer's machine.
#
# Actions are pinned to commit SHAs (Dependabot keeps them current), so a
# moved tag upstream cannot change what builds the release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The tag being released, else dev-<commit>.
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}

jobs:
  providers:
    name: WebAssembly providers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-wasip2

      # The packaging tool links Violet's storage crate, whose keychain
      # support needs D-Bus on Linux.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      # Published builds start clean: a poisoned cache must not reach a
      # release.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.ref_type != 'tag'
        with:
          workspaces: |
            . -> target
            providers/postgres -> target
            providers/mysql -> target

      - name: Build and package
        run: scripts/package-providers.sh dist

      - name: Check the catalogue
        run: |
          test -s dist/providers.json
          ls -l dist
          cat dist/providers.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: providers
          path: dist/
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.ref_type != 'tag'

      - name: Build
        run: cargo build --release --locked --bin violet

      - name: Package
        shell: pwsh
        run: |
          # Named as the updater (fastframe-update) looks for it; the
          # marker lets a copy from this archive replace itself.
          $name = "violet-$($env:VERSION)-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path "package/$name" | Out-Null
          Copy-Item target/release/violet.exe "package/$name/"
          Set-Content -NoNewline -Encoding ascii -Path "package/$name/violet-portable.txt" -Value "violet-portable-v1`n"
          Copy-Item README.md "package/$name/"
          Compress-Archive -Path "package/$name" -DestinationPath "package/$name.zip"
          $hash = (Get-FileHash "package/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "package/$name.zip.sha256"
          Remove-Item -Recurse "package/$name"
          Get-ChildItem package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: package/
          if-no-files-found: error

  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.ref_type != 'tag'

      - name: Build and package
        run: scripts/package-macos.sh "$VERSION" package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: package/
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          # The oldest supported Ubuntu, so the binary needs no newer glibc
          # than most desktops have.
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      # D-Bus for the keychain (Secret Service); the window libraries are
      # loaded at run time.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.ref_type != 'tag'

      - name: Build and package
        run: scripts/package-linux.sh "$VERSION" package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: package/
          if-no-files-found: error

  release:
    name: Publish
    needs: [providers, windows, macos, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The updater compares the tag with the version the app reports.
      - name: The tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml's $version" >&2
            exit 1
          }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Not `assets`: that is the repository's own folder.
          path: release
          merge-multiple: true

      # checksums.txt lists every asset; checksums.txt.sig is its raw
      # Ed25519 signature, which installed copies check against
      # assets/update-public-key.hex before taking an update.
      - name: Sign the checksums
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          test -n "$UPDATE_SIGNING_KEY" || {
            echo "The UPDATE_SIGNING_KEY secret is missing" >&2
            exit 1
          }
          cd release
          sha256sum -- * | grep -v -e ' checksums.txt' > ../checksums.txt
          mv ../checksums.txt .
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -rawin -inkey "$key" -in checksums.txt -out checksums.txt.sig
          test "$(wc -c < checksums.txt.sig)" -eq 64
          # The signature verifies against the key the app embeds.
          pub=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | xxd -p -c 64)
          test "$pub" = "$(tr -d '[:space:]' < ../assets/update-public-key.hex)" || {
            echo "UPDATE_SIGNING_KEY is not the key assets/update-public-key.hex names" >&2
            exit 1
          }
          cat checksums.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Violet $GITHUB_REF_NAME" \
            --generate-notes
