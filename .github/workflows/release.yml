# Builds Violet for Windows, macOS and Linux, and the database providers
# (WebAssembly components), and publishes them.
#
# - Push a tag `v*` (git tag v0.1.0 && git push origin v0.1.0): everything
#   is built and attached to a GitHub release of that tag. The providers'
#   files sit at the release's top level, where Violet looks for them:
#   releases/latest/download/providers.json.
# - Run it by hand (Actions > Release > Run workflow): everything is built
#   and kept as workflow artifacts only, nothing is published.
# - A push to master that changes the dependencies builds the same way, to
#   refresh the build cache the tag builds start from (see below).
#
# The packages are built by scripts/package-*.sh, which run the same way
# on a developer's machine.
#
# Actions are pinned to commit SHAs (Dependabot keeps them current), so a
# moved tag upstream cannot change what builds the release.
name: Release

on:
  push:
    tags: ["v*"]
    # Caches saved on the default branch are the only ones a tag can read:
    # each tag is a new ref, and caches are scoped to the ref saving them.
    branches: [master]
    paths:
      - Cargo.lock
      - providers/*/Cargo.lock
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The tag being released, else dev-<commit>.
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}

jobs:
  providers:
    name: WebAssembly providers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-wasip2

      # The packaging tool links Violet's storage crate, whose keychain
      # support needs D-Bus on Linux.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      # Tag builds only read the cache, never save it, and can read only
      # what master saved: pull requests save under their own ref, so what
      # they build cannot reach a release.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref_type != 'tag' }}
          workspaces: |
            . -> target
            providers/postgres -> target
            providers/mysql -> target
            providers/sqlite -> target
            providers/redis -> target

      # SQLite is C: the WASI SDK's clang builds it for wasm32-wasip2.
      # Pinned by digest, like the actions.
      - name: WASI SDK
        env:
          WASI_SDK: wasi-sdk-34.0-x86_64-linux
          WASI_SDK_SHA256: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
        run: |
          curl -fsSL -o "$RUNNER_TEMP/wasi-sdk.tar.gz" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/$WASI_SDK.tar.gz"
          echo "$WASI_SDK_SHA256  $RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/$WASI_SDK" >> "$GITHUB_ENV"

      - name: Build and package
        run: scripts/package-providers.sh dist

      - name: Check the catalogue
        run: |
          test -s dist/providers.json
          ls -l dist
          cat dist/providers.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: providers
          path: dist/
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref_type != 'tag' }}

      # The Windows Installer package is built with the WiX Toolset,
      # pinned like the actions.
      - name: WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $tools = Join-Path $env:USERPROFILE .dotnet/tools
          $env:PATH = "$tools;$env:PATH"
          $tools | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          wix extension add --global WixToolset.Util.wixext/5.0.2

      # The portable zip and the .msi, named as the updater
      # (fastframe-update) looks for them.
      - name: Build and package
        shell: pwsh
        run: scripts/package-windows.ps1 -Version $env:VERSION -OutDir package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: package/
          if-no-files-found: error

  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref_type != 'tag' }}

      - name: Build and package
        run: scripts/package-macos.sh "$VERSION" package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: package/
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          # The oldest supported Ubuntu, so the binary needs no newer glibc
          # than most desktops have.
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      # D-Bus for the keychain (Secret Service); the window libraries are
      # loaded at run time.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref_type != 'tag' }}

      - name: Build and package
        run: scripts/package-linux.sh "$VERSION" package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: package/
          if-no-files-found: error

  release:
    name: Publish
    needs: [providers, windows, macos, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The updater compares the tag with the version the app reports.
      - name: The tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml's $version" >&2
            exit 1
          }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Not `assets`: that is the repository's own folder.
          path: release
          merge-multiple: true

      # checksums.txt lists every asset; checksums.txt.sig is its raw
      # Ed25519 signature, which installed copies check against
      # assets/update-public-key.hex before taking an update.
      - name: Sign the checksums
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          test -n "$UPDATE_SIGNING_KEY" || {
            echo "The UPDATE_SIGNING_KEY secret is missing" >&2
            exit 1
          }
          cd release
          sha256sum -- * | grep -v -e ' checksums.txt' > ../checksums.txt
          mv ../checksums.txt .
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -rawin -inkey "$key" -in checksums.txt -out checksums.txt.sig
          test "$(wc -c < checksums.txt.sig)" -eq 64
          # The signature verifies against the key the app embeds.
          pub=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | xxd -p -c 64)
          test "$pub" = "$(tr -d '[:space:]' < ../assets/update-public-key.hex)" || {
            echo "UPDATE_SIGNING_KEY is not the key assets/update-public-key.hex names" >&2
            exit 1
          }
          cat checksums.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Violet $GITHUB_REF_NAME" \
            --generate-notes
