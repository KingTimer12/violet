# Builds Violet and the providers from a version tag and publishes them.
#
#   git tag v0.1.10 && git push origin v0.1.10
#
# Everything is built and attached to a GitHub release of that tag. The
# providers' files sit at the release's top level, where Violet looks for
# them: releases/latest/download/providers.json.
#
# The version comes from the tag: scripts/bump-version.sh sets it in
# Cargo.toml and in every Cargo.lock (root and providers) inside each build
# job, so the app reports the tag's version (the updater compares the two).
# The bump is not committed back; the repository keeps whatever version
# it had.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-tag:
    name: Check the tag
    runs-on: ubuntu-latest
    steps:
      - name: The tag is vMAJOR.MINOR.PATCH
        run: |
          echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          }

  build:
    needs: check-tag
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}
      bump: true

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Not `assets`: that is the repository's own folder.
          path: release
          merge-multiple: true

      # checksums.txt lists every asset; checksums.txt.sig is its raw
      # Ed25519 signature, which installed copies check against
      # assets/update-public-key.hex before taking an update.
      - name: Sign the checksums
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          test -n "$UPDATE_SIGNING_KEY" || {
            echo "The UPDATE_SIGNING_KEY secret is missing" >&2
            exit 1
          }
          cd release
          sha256sum -- * | grep -v -e ' checksums.txt' > ../checksums.txt
          mv ../checksums.txt .
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -rawin -inkey "$key" -in checksums.txt -out checksums.txt.sig
          test "$(wc -c < checksums.txt.sig)" -eq 64
          # The signature verifies against the key the app embeds.
          pub=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | xxd -p -c 64)
          test "$pub" = "$(tr -d '[:space:]' < ../assets/update-public-key.hex)" || {
            echo "UPDATE_SIGNING_KEY is not the key assets/update-public-key.hex names" >&2
            exit 1
          }
          cat checksums.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Violet $GITHUB_REF_NAME" \
            --generate-notes
