[package]
name = "violet-wasm"
description = "Runs Violet database providers compiled to WebAssembly, in a sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
violet-core.workspace = true
hotpath.workspace = true
async-trait.workspace = true
log.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
wasmtime = { version = "49.0.2", default-features = false, features = ["component-model", "async", "cranelift", "runtime", "std", "cache", "parallel-compilation"] }
wasmtime-wasi = { version = "49.0.2", default-features = false, features = ["p2"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
# SQLite's byte-range locks on a file-based provider's database.
file-guard = "0.2"

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
