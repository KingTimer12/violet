[package]
name = "violet-storage"
description = "Persistence adapters for Violet: profiles on disk, secrets in the OS keychain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
violet-core.workspace = true
hotpath.workspace = true
directories.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
zeroize = { workspace = true, features = ["serde"] }
# The vault: passwords sealed with a key kept in the keychain, or wrapped
# by a master password.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
getrandom = "0.4"
# Keeps the vault's key out of swap (mlock / VirtualLock), through a safe API.
region = "3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
