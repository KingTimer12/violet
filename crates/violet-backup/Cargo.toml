[package]
name = "violet-backup"
description = "Encrypted, portable workspace backups"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
violet-core.workspace = true
violet-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
zeroize.workspace = true
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
getrandom = "0.4"
tar = { version = "0.4", default-features = false }
zstd = { version = "0.14", default-features = false }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
